  <title>Pelican on a Bicycle</title>
  <style>
    * { box-sizing: border-box; }
    html { color-scheme: dark; }
    body {

      min-height: 100svh;
      margin: 0;
      padding: clamp(0px, 2.8vw, 36px);
      display: grid;
      place-items: center;
      background: #163b3b;
    }
    main {
      position: relative;
      width: min(100%, 1280px, 156svh);
      overflow: hidden;
      border-radius: clamp(0px, 1.15vw, 15px);
      background: #f5dab0;
      box-shadow: 0 23px 80px #081f2070, 0 0 0 1px #f8e5b72b;
    }
    svg { display: block; width: 100%; height: auto; }
    button {
      position: absolute;
      right: clamp(9px, 1.5vw, 20px);
      bottom: clamp(9px, 1.5vw, 20px);
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      padding: 0;
      border: 1px solid #f8e8cba0;
      border-radius: 50%;
      background: #163b3bea;
      color: #fff1d8;
      cursor: pointer;
    }
    button:hover { background: #275853; }
    button:focus-visible { outline: 3px solid #fff1d8; outline-offset: 4px; }
    button svg { width: 18px; height: 18px; }
    button[data-paused="true"] .pause-icon,
    button[data-paused="false"] .play-icon { display: none; }
    @media (max-aspect-ratio: 1/1) {
      main > svg { width: 160%; margin-left: -30%; }
    }
  </style>
</head>

    const flecks = document.getElementById("flecks");
    const markings = document.getElementById("lane-markings");
    const gulls = document.getElementById("gulls");
    const ripples = document.getElementById("ripples");
    const grassLeft = document.getElementById("grass-left");
    const grassRight = document.getElementById("grass-right");

    function getLeg(side, hipX, hipY, thighLength, shinLength) {
      return {
        hipX, hipY, thighLength, shinLength,
        lower: [
          document.getElementById(side + "-leg-edge"),
          document.getElementById(side + "-leg-color")
        ],
        upper: [document.getElementById(side + "-thigh")],
        crank: [document.getElementById(side + "-crank")],
        foot: document.getElementById(side + "-foot")
      };
    }

    const farLeg = getLeg("far", 469, 274, 86, 81);
    const nearLeg = getLeg("near", 452, 276, 87, 89);
    nearLeg.lower.push(document.getElementById("near-leg-light"));
    nearLeg.upper.push(document.getElementById("near-thigh-edge"));
    nearLeg.crank.push(document.getElementById("crank-light"));

    function setPath(paths, data) {
      for (const path of paths) path.setAttribute("d", data);
    }

    function drawLeg(leg, angle, bob) {
      const pedalX = 467 + 27 * Math.cos(angle);
      const pedalY = 420 + 27 * Math.sin(angle);
      const ankleX = pedalX - 3;
      const ankleY = pedalY - 6;
      const hipY = leg.hipY + bob;
      const dx = ankleX - leg.hipX;
      const dy = ankleY - hipY;
      const distance = Math.hypot(dx, dy);
      // Find the forward knee at the intersection of the thigh and shin arcs.
      const along = (leg.thighLength ** 2 - leg.shinLength ** 2 + distance ** 2) / (2 * distance);
      const across = Math.sqrt(Math.max(0, leg.thighLength ** 2 - along ** 2));
      const kneeX = leg.hipX + (along * dx + across * dy) / distance;
      const kneeY = hipY + (along * dy - across * dx) / distance;
      const featherEndX = leg.hipX + (kneeX - leg.hipX) * .74;
      const featherEndY = hipY + (kneeY - hipY) * .74;

      setPath(leg.lower, `M${leg.hipX} ${hipY}L${kneeX} ${kneeY}L${ankleX} ${ankleY}`);
      setPath(leg.upper, `M${leg.hipX} ${hipY}L${featherEndX} ${featherEndY}`);
      setPath(leg.crank, `M467 420L${pedalX} ${pedalY}`);
      leg.foot.setAttribute("transform", `translate(${pedalX} ${pedalY}) rotate(${7 * Math.cos(angle)})`);
    }

    function draw(seconds) {
      const angle = .9 + seconds * Math.PI * 2 / 1.48;
      const bob = 1.55 * Math.cos(angle * 2 + .7);
      drawLeg(farLeg, angle + Math.PI, bob);
      drawLeg(nearLeg, angle, bob);
      pelican.setAttribute("transform", `translate(0 ${bob}) rotate(${.56 * Math.sin(angle)} 452 276)`);
      const roadDistance = seconds * 365;
      const wheelAngle = (roadDistance / 88 * 180 / Math.PI) % 360;
      for (const wheel of wheels) wheel.setAttribute("transform", `rotate(${wheelAngle})`);
      flecks.setAttribute("transform", `translate(${-(roadDistance % 94)} 0)`);
      markings.setAttribute("transform", `translate(${-(roadDistance % 165)} 0)`);
      gulls.setAttribute("transform", `translate(${5 * Math.sin(seconds * .65)} ${2 * Math.sin(seconds * 1.12)})`);
      ripples.setAttribute("transform", `translate(${4 * Math.sin(seconds * 1.6)} 0)`);
      grassLeft.setAttribute("transform", `rotate(${1.4 * Math.sin(seconds * 2.4)} 48 600)`);
      grassRight.setAttribute("transform", `rotate(${1.7 * Math.sin(seconds * 2.4 + 1.1)} 943 600)`);
    }

    let seconds = 0;
    let lastFrame;
    let frameRequest = null;
    let paused = motionPreference.matches;

    function animate(timestamp) {
      if (lastFrame !== undefined) seconds += Math.min((timestamp - lastFrame) / 1000, .05);
      lastFrame = timestamp;
      draw(seconds);
      frameRequest = requestAnimationFrame(animate);
    }

    function updatePlayback() {
      const label = paused ? "Play animation" : "Pause animation";
      toggle.dataset.paused = String(paused);
      toggle.setAttribute("aria-label", label);
      toggle.title = label;
      if (paused && frameRequest !== null) {
        cancelAnimationFrame(frameRequest);
        frameRequest = null;
        lastFrame = undefined;
      } else if (!paused && frameRequest === null) {
        frameRequest = requestAnimationFrame(animate);
      }
    }

    toggle.addEventListener("click", () => {
      paused = !paused;
      updatePlayback();
    });
    motionPreference.addEventListener("change", event => {
      paused = event.matches;
      updatePlayback();
    });
    draw(0);
    updatePlayback();
  </script>
</body>
</html>
