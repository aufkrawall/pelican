<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pelican Riding a Bicycle</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(180deg, #d7eff9 0%, #eef7fb 52%, #f7efe0 100%);
      color: #244452; display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    main { width: 100%; max-width: 1040px; padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .canvas-card {
      width: 100%; border-radius: 22px; overflow: hidden; background: #87cefa; cursor: pointer;
      user-select: none; -webkit-tap-highlight-color: transparent;
      box-shadow: 0 20px 50px rgba(24, 68, 88, 0.16), 0 4px 12px rgba(24, 68, 88, 0.08), 0 0 0 1px rgba(255, 255, 255, 0.7) inset;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .canvas-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 26px 60px rgba(24, 68, 88, 0.20), 0 6px 16px rgba(24, 68, 88, 0.10), 0 0 0 1px rgba(255, 255, 255, 0.8) inset;
    }
    svg#pelican-scene { display: block; width: 100%; height: auto; overflow: hidden; }
    .caption { font-size: 0.9rem; letter-spacing: 0.02em; color: #486b7a; opacity: 0.88; text-align: center; }
    .caption span {
      display: inline-block; padding: 4px 14px; border-radius: 999px;
      background: rgba(255, 255, 255, 0.68); backdrop-filter: blur(6px);
      box-shadow: 0 2px 8px rgba(36, 68, 82, 0.06);
    }
    #bell-waves path { opacity: 0; transform-box: fill-box; transform-origin: center; }
    .ringing #bell-waves .wave-1 { animation: bellWave 0.7s ease-out forwards; }
    .ringing #bell-waves .wave-2 { animation: bellWave 0.7s ease-out 0.12s forwards; }
    .ringing #bell-waves .wave-3 { animation: bellWave 0.7s ease-out 0.24s forwards; }
    .ringing #bell-dome { transform-box: fill-box; transform-origin: center bottom; animation: bellShake 0.45s ease-in-out; }
    @keyframes bellWave {
      0% { opacity: 0.95; transform: scale(0.4) translate(0, 0); }
      100% { opacity: 0; transform: scale(2.1) translate(4px, -6px); }
    }
    @keyframes bellShake {
      0%, 100% { transform: rotate(0deg); }
      20% { transform: rotate(-14deg); }
      40% { transform: rotate(14deg); }
      60% { transform: rotate(-10deg); }
      80% { transform: rotate(8deg); }
    }
  </style>
</head>

  <script>
    (function () {
      const card = document.getElementById('scene-card');
      let audioCtx = null, timer = null;
      function playBellChime() {
        try {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return;
          if (!audioCtx) audioCtx = new AC();
          if (audioCtx.state === 'suspended') audioCtx.resume();
          const now = audioCtx.currentTime;
          [0, 0.14].forEach((offset, idx) => {
            (idx === 0 ? [1760, 3520] : [1975, 3950]).forEach((f, j) => {
              const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
              osc.type = 'sine'; osc.frequency.setValueAtTime(f, now + offset);
              gain.gain.setValueAtTime(j === 0 ? 0.12 : 0.04, now + offset);
              gain.gain.exponentialRampToValueAtTime(0.0005, now + offset + 0.55);
              osc.connect(gain); gain.connect(audioCtx.destination);
              osc.start(now + offset); osc.stop(now + offset + 0.6);
            });
          });
        } catch (_) {}
      }
      function triggerBell() {
        card.classList.remove('ringing');
        void card.offsetWidth;
        card.classList.add('ringing');
        clearTimeout(timer);
        timer = setTimeout(() => card.classList.remove('ringing'), 1000);
        playBellChime();
      }
      card.addEventListener('click', triggerBell);
      card.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); triggerBell(); }
      });
    })();
  </script>
