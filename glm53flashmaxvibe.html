<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pelican riding a bicycle</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 25%, #16233a, #0b1220 75%);
  }
  svg {
    width: min(92vw, 900px); height: auto; display: block;
    border-radius: 26px; box-shadow: 0 30px 70px rgba(0,0,0,.5);
  }

  /* --- motion --- */
  .pBob   { animation: bob 1.1s ease-in-out infinite alternate; }
  .wheelRot { animation: spin .9s linear infinite; transform-box: fill-box; transform-origin: center; }
  .rays   { animation: spin 80s linear infinite; transform-box: fill-box; transform-origin: center; }
  .crank  { animation: spin 1.5s linear infinite; }
  .scarf  { animation: flut .8s ease-in-out infinite alternate; transform-box: view-box; transform-origin: 404px 206px; }
  .zoomL  { animation: zoom 1.4s linear infinite; }
  .zoomL.d2 { animation-delay: -.45s; }
  .zoomL.d3 { animation-delay: -.9s; }
  .cloud  { animation: drift linear infinite; }
  .c1 { animation-duration: 70s;  animation-delay: -20s; }
  .c2 { animation-duration: 95s;  animation-delay: -55s; }
  .c3 { animation-duration: 120s; animation-delay: -85s; }

  @keyframes spin  { to { transform: rotate(360deg); } }
  @keyframes bob   { from { transform: translateY(0); } to { transform: translateY(-3px); } }
  @keyframes flut  { from { transform: rotate(-4deg); } to { transform: rotate(7deg); } }
  @keyframes drift { from { transform: translateX(860px); } to { transform: translateX(-260px); } }
  @keyframes zoom  { 0% { opacity: .55; } 50% { opacity: .12; } 100% { opacity: .55; } }

  @keyframes dashmove { to { stroke-dashoffset: 128; } }
  .dashline { animation: dashmove .5s linear infinite; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; }
  }
</style>
</head>
<body>

<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A pelican riding a bicycle along a road">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe7ff"/>
      <stop offset="1" stop-color="#eaf7ff"/>
    </linearGradient>
    <linearGradient id="peli" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8eef6"/>
    </linearGradient>
  </defs>

  <!-- backdrop -->
  <rect x="0" y="0" width="800" height="500" fill="url(#sky)"/>
  <ellipse cx="170" cy="398" rx="120" ry="30" fill="#d8ecdd"/>
  <ellipse cx="620" cy="398" rx="150" ry="36" fill="#cfe6d4"/>

  <!-- sun -->
  <g transform="translate(100 88)">
    <g class="rays" stroke="#ffd166" stroke-width="4" stroke-linecap="round">
      <line x1="42" y1="0" x2="58" y2="0"/>
      <line x1="-42" y1="0" x2="-58" y2="0"/>
      <line x1="0" y1="42" x2="0" y2="58"/>
      <line x1="0" y1="-42" x2="0" y2="-58"/>
      <line x1="30" y1="30" x2="41" y2="41"/>
      <line x1="-30" y1="30" x2="-41" y2="41"/>
      <line x1="30" y1="-30" x2="41" y2="-41"/>
      <line x1="-30" y1="-30" x2="-41" y2="-41"/>
    </g>
    <circle r="30" fill="#ffd166"/>
    <circle r="23" fill="#ffe08a"/>
  </g>

  <!-- clouds -->
  <g class="cloud" fill="#ffffff" opacity=".9">
    <ellipse cx="0"   cy="64" rx="36" ry="14"/>
    <ellipse cx="28"  cy="58" rx="26" ry="12"/>
    <ellipse cx="-30" cy="70" rx="26" ry="11"/>
  </g>
  <g class="cloud" fill="#ffffff" opacity=".8">
    <ellipse cx="0"  cy="30" rx="30" ry="12"/>
    <ellipse cx="24" cy="25" rx="20" ry="10"/>
  </g>
  <g class="cloud" fill="#ffffff" opacity=".7">
    <ellipse cx="0" cy="90" rx="26" ry="10"/>
  </g>

  <!-- speed lines -->
  <g stroke="#b6c6d8" stroke-width="5" stroke-linecap="round">
    <line class="zoomL"    x1="150" y1="290" x2="215" y2="290"/>
    <line class="zoomL d2" x1="140" y1="330" x2="200" y2="330"/>
    <line class="zoomL d3" x1="160" y1="365" x2="220" y2="365"/>
  </g>

  <!-- ground -->
  <rect x="0" y="400" width="800" height="100" fill="#56637a"/>
  <line x1="0" y1="406" x2="800" y2="406" stroke="#f1f5f9" stroke-width="4"
        stroke-dasharray="34 30" class="dashline" opacity=".85"/>
  <ellipse cx="400" cy="402" rx="135" ry="7" fill="#1e293b" opacity=".18"/>

  <!-- ================= BIKE + RIDER ================= -->

  <!-- far leg (behind frame) -->
  <g id="legFar" stroke="#b9722e" stroke-width="7" stroke-linecap="round" fill="none">
    <line id="tF"/>
    <line id="sF"/>
    <g id="footF">
      <path d="M -4 -2 Q 8 -8 18 -3 Q 16 5 6 7 Q -4 6 -4 -2 Z" fill="#b9722e" stroke="none"/>
    </g>
  </g>

  <!-- far crank arm + pedal (JS rotated) -->
  <g id="crankF" stroke="#475569" stroke-width="5" stroke-linecap="round">
    <g id="pedFG" transform="translate(-24 0)">
      <rect id="pedFR" x="-11" y="-4" width="22" height="7" rx="3" fill="#333d49" stroke="none"/>
    </g>
    <line x1="0" y1="0" x2="-24" y2="0"/>
  </g>

  <!-- frame -->
  <g stroke="#e63946" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M 400 362 L 384 289 L 462 301 L 400 362"/>
    <path d="M 384 289 L 320 350"/>
    <path d="M 462 301 L 480 350"/>
  </g>
  <!-- handlebar -->
  <g stroke="#475569" stroke-width="5" stroke-linecap="round">
    <line x1="462" y1="301" x2="455" y2="283"/>
    <line x1="455" y1="283" x2="441" y2="272"/>
  </g>
  <!-- saddle -->
  <ellipse cx="381" cy="282" rx="16" ry="5.5" fill="#334155" transform="rotate(-5 381 282)"/>

  <!-- rear wheel -->
  <g transform="translate(320 350)">
    <g class="wheelRot" stroke="#a8b3c2" stroke-width="3">
      <line x1="-46" y1="0" x2="46" y2="0"/>
      <line x1="0" y1="-46" x2="0" y2="46"/>
      <line x1="-33" y1="-33" x2="33" y2="33"/>
    </g>
    <circle r="46" fill="none" stroke="#2f3640" stroke-width="8"/>
    <circle r="6" fill="#2f3640"/>
  </g>

  <!-- front wheel -->
  <g transform="translate(480 350)">
    <g class="wheelRot" stroke="#a8b3c2" stroke-width="3">
      <line x1="-46" y1="0" x2="46" y2="0"/>
      <line x1="0" y1="-46" x2="0" y2="46"/>
      <line x1="-33" y1="-33" x2="33" y2="33"/>
      <line x1="-33" y1="33" x2="33" y2="-33"/>
    </g>
    <circle r="46" fill="none" stroke="#2f3640" stroke-width="8"/>
    <circle r="6" fill="#2f3640"/>
  </g>

  <!-- chain -->
  <g stroke="#475569" stroke-width="2.5" opacity=".75">
    <line x1="392" y1="355" x2="320" y2="344"/>
    <line x1="392" y1="369" x2="320" y2="356"/>
  </g>
  <circle cx="400" cy="362" r="10" fill="none" stroke="#475569" stroke-width="3"/>
  <circle cx="400" cy="362" r="4.5" fill="#475569"/>

  <!-- near crank arm + pedal (JS rotated) -->
  <g id="crankN" stroke="#475569" stroke-width="5" stroke-linecap="round">
    <line x1="400" y1="362" x2="424" y2="362"/>
    <g id="pedNG" transform="translate(24 0)">
      <rect id="pedNR" x="-11" y="-4" width="22" height="7" rx="3" fill="#414b5a" stroke="none"/>
    </g>
  </g>

  <!-- near leg (JS animated) -->
  <g stroke="#f5a03c" stroke-width="7" stroke-linecap="round" fill="none">
    <line id="tN"/>
    <line id="sN"/>
    <g id="footN">
      <path d="M -4 -2 Q 8 -8 18 -3 Q 16 5 6 7 Q -4 6 -4 -2 Z" fill="#f5a03c" stroke="none"/>
    </g>
  </g>

  <!-- ================= PELICAN ================= -->
  <g class="pBob">
    <!-- tail feathers -->
    <path d="M 336 220 L 306 208 L 338 232 Z" fill="#f6fafc" stroke="#c9d4e2" stroke-width="1.5"/>
    <path d="M 338 228 L 314 232 L 340 244 Z" fill="#f6fafc" stroke="#c9d4e2" stroke-width="1.5"/>

    <!-- body -->
    <ellipse cx="374" cy="228" rx="52" ry="36" fill="url(#peli)" stroke="#c9d4e2" stroke-width="2" transform="rotate(-8 374 228)"/>

    <!-- wing -->
    <ellipse cx="372" cy="232" rx="27" ry="15" fill="#f7fafc" stroke="#c9d4e2" stroke-width="1.5" transform="rotate(-10 372 232)"/>
    <path d="M 350 238 q 18 10 40 3" fill="none" stroke="#d3dde9" stroke-width="2" stroke-linecap="round"/>

    <!-- neck (outlined tube) -->
    <path d="M 398 214 C 420 202 432 192 442 180" fill="none" stroke="#c9d4e2" stroke-width="14.5" stroke-linecap="round"/>
    <path d="M 398 214 C 420 202 432 192 442 180" fill="none" stroke="#ffffff" stroke-width="11" stroke-linecap="round"/>

    <!-- head -->
    <circle cx="448" cy="176" r="14.5" fill="#ffffff" stroke="#c9d4e2" stroke-width="1.5"/>

    <!-- beak: pouch + upper mandible -->
    <path d="M 457 176 C 468 208 496 206 507 187 L 456 171 Z"
          fill="#fb8b24" stroke="#e5a50a" stroke-width="1"/>
    <path d="M 456 168 L 512 184 L 508 190 L 456 178 Z"
          fill="#ffb703" stroke="#e5a50a" stroke-width="1"/>

    <!-- eye -->
    <circle cx="450" cy="166" r="3" fill="#1f2937"/>
    <circle cx="451" cy="165" r="1" fill="#ffffff"/>

    <!-- helmet -->
    <path d="M 433 164 Q 448 136 463 163 Z" fill="#2a9d8f" stroke="#21867a" stroke-width="1.5"/>
    <line x1="431" y1="165" x2="465" y2="163" stroke="#21867a" stroke-width="3" stroke-linecap="round"/>

    <!-- scarf -->
    <g class="scarf">
      <path d="M 402 210 q -20 6 -30 16" fill="none" stroke="#d62828" stroke-width="8" stroke-linecap="round"/>
      <path d="M 402 210 q -12 2 -20 12" fill="none" stroke="#e63946" stroke-width="8" stroke-linecap="round"/>
      <circle cx="404" cy="208" r="5" fill="#d62828"/>
    </g>
  </g>

  <text x="22" y="478" font-family="system-ui, sans-serif" font-size="15" font-style="italic" fill="#8b98ad">pelican express</text>
</svg>

<script>
(function () {
  var els = {
    tN: document.getElementById('tN'),
    sN: document.getElementById('sN'),
    fN: document.getElementById('footN'),
    tF: document.getElementById('tF'),
    sF: document.getElementById('sF'),
    fF: document.getElementById('footF'),
    crankN: document.getElementById('crankN'),
    crankF: document.getElementById('crankF'),
    pedNG: document.getElementById('pedNG'),
    pedFG: document.getElementById('pedFG')
  };

  // hip anchors (viewer coords)
  var HIP_N = { x: 390, y: 256 };
  var HIP_F = { x: 384, y: 252 };

  var BB = { x: 400, y: 362 };   // bottom bracket (crank centre)
  var CRANK_R = 24;

  var TAU = Math.PI * 2;

  function setLine(l, x1, y1, x2, y2) {
    l.setAttribute('x1', x1); l.setAttribute('y1', y1);
    l.setAttribute('x2', x2); l.setAttribute('y2', y2);
  }

  // two-bone IK: returns knee point, bends toward +x (forward)
  function kneeFor(H, P, l1, l2) {
    var dx = P.x - H.x, dy = P.y - H.y;
    var d = Math.hypot(dx, dy);
    var dc = Math.max(Math.abs(l1 - l2) + 6, Math.min(l1 + l2 - 2, d));
    var a = (l1 * l1 - l2 * l2 + dc * dc) / (2 * dc);
    var h = Math.sqrt(Math.max(l1 * l1 - a * a, 0));
    var ux = dx / d, uy = dy / d;
    // mid point of effective ankle, then push knee toward the front (+x)
    var mx = H.x + ux * a, my = H.y + uy * a;
    return { x: mx + h * uy, y: my - h * ux };
  }

  function frame(now) {
    var t = now - t0;
    var th = (t / 1000) * (TAU / 1.5);           // crank angle: 1 rev / 1.5 s
    var deg = th * 180 / Math.PI;

    // pedal positions
    var pN = { x: BB.x + CRANK_R * Math.cos(th),        y: BB.y + CRANK_R * Math.sin(th) };
    var pF = { x: BB.x - CRANK_R * Math.cos(th),        y: BB.y - CRANK_R * Math.sin(th) };

    // rotate the crank arms
    var tf = 'translate(' + BB.x + ' ' + BB.y + ') rotate(' + deg + ')';
    // crank arms: near arm is absolute-coord (rotate about BB), far arm is BB-relative
    els.crankN.setAttribute('transform', 'rotate(' + deg + ' ' + BB.x + ' ' + BB.y + ')');
    els.crankF.setAttribute('transform', tf);

    // keep pedals level, Counter-rotate
    els.pedNG.setAttribute('transform', 'translate(24 0) rotate(' + (-deg) + ')');
    els.pedFG.setAttribute('transform', 'translate(-24 0) rotate(' + (-deg) + ')');

    // legs: two segments each, knee bends forward
    var KN = kneeFor(HIP_N, pN, 62, 70);
    setLine(els.tN, HIP_N.x, HIP_N.y, KN.x, KN.y);
    setLine(els.sN, KN.x, KN.y, pN.x, pN.y);
    els.fN.setAttribute('transform', 'translate(' + pN.x + ' ' + (pN.y - 3) + ')');

    var KF = kneeFor(HIP_F, pF, 62, 70);
    setLine(els.tF, HIP_F.x, HIP_F.y, KF.x, KF.y);
    setLine(els.sF, KF.x, KF.y, pF.x, pF.y);
    els.fF.setAttribute('transform', 'translate(' + pF.x + ' ' + (pF.y - 3) + ')');

    requestAnimationFrame(frame);
  }

  var t0 = performance.now();
  if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    requestAnimationFrame(frame);
  } else {
    // static pose for reduced motion
    var th = 0.9, pN = { x: BB.x + CRANK_R * Math.cos(th), y: BB.y + CRANK_R * Math.sin(th) };
    var kN = kneeFor(HIP_N, pN, 62, 70);
    setLine(els.tN, HIP_N.x, HIP_N.y, kN.x, kN.y);
    setLine(els.sN, kN.x, kN.y, pN.x, pN.y);
  }
})();
</script>

</body>
</html>
