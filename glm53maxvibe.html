<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pelican on a Bicycle — Animated SVG</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center;
    background: radial-gradient(1100px 700px at 50% 18%, #27455e, #14212e 70%);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    color: #eaf4fb;
    padding: 26px 0 40px;
  }
  .stage { display: grid; justify-items: center; gap: 13px; margin: 0; }
  .kicker { font-size: .72rem; letter-spacing: .34em; text-transform: uppercase; opacity: .55; font-weight: 600; }
  svg {
    width: min(96vw, 1000px); height: auto; display: block;
    border-radius: 20px;
    box-shadow: 0 30px 80px rgba(6, 16, 26, .55), 0 4px 16px rgba(6,16,26,.4);
    background: #bfe3ff;
  }
  figcaption { font-size: .8rem; opacity: .55; }
  @media (max-width: 560px){ svg { border-radius: 12px; } }

  /* ---- small loops that are simpler in CSS ---- */
  #rays   { transform-box: fill-box; transform-origin: center; animation: sunspin 80s linear infinite; }
  @keyframes sunspin { to { transform: rotate(360deg); } }
  #sunglow { transform-box: fill-box; transform-origin: center; animation: glow 6s ease-in-out infinite; }
  @keyframes glow { 0%,100% { opacity:.35; transform: scale(1); } 50% { opacity:.55; transform: scale(1.1); } }
  #eyelid { transform-box: fill-box; transform-origin: center; animation: blink 4.6s infinite; }
  @keyframes blink { 0%, 93.6%, 100% { transform: scaleY(0); } 95.2% { transform: scaleY(1); } 96.8% { transform: scaleY(0); } }
  .streamer { transform-origin: 545px 269px; }
  .s1 { animation: flap .62s ease-in-out infinite alternate; }
  .s2 { animation: flap .55s ease-in-out -0.20s infinite alternate; }
  .s3 { animation: flap .48s ease-in-out -0.35s infinite alternate; }
  @keyframes flap { from { transform: rotate(-8deg); } to { transform: rotate(7deg); } }
  #flag { transform-box: fill-box; transform-origin: 0% 50%; animation: flutter .8s ease-in-out infinite alternate; }
  @keyframes flutter { from { transform: skewY(-5deg); } to { transform: skewY(6deg); } }
</style>
</head>

      <path d="M 536 254 C 550 258 554 268 546 276 C 548 266 542 258 532 258 Z" fill="#9db2c4" stroke="#8299ad" stroke-width="2"/>
      <path d="M 524 252 C 534 254 538 260 535 266 C 532 258 526 254 518 256 Z" fill="#b8c9d6" stroke="#93a9ba" stroke-width="2"/>
    </g>
  </g>
</svg>

<figcaption>One pelican, one bicycle, one endless boardwalk — pure SVG with a sprinkle of JavaScript, zero images.</figcaption>
</figure>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const setT = (el, tr) => el.setAttribute('transform', tr);

  // scene constants
  const V = 273;                 // ground speed, px/s
  const WHEEL_R = 62;
  const WHEEL_W = V / WHEEL_R;   // wheel angular speed
  const CRANK_W = 6.2;           // pedalling cadence
  const CRANK_R = 30;
  const BB = { x: 330, y: 418 };
  const L1 = 72, L2 = 72;        // thigh / shin
  const HIP_N = { x: 340, y: 306 }, HIP_F = { x: 326, y: 305 };
  const WRAP = 2160;

  const ref = {};
  ['spokesR','spokesF','cring','armN','armF','pedalN','pedalF',
   'legNo','legNm','legFo','legFm','footN','footF',
   'bodyG','headG','pouchG','shadow','centerline','chainTop','chainBot',
   'foam1','foam2','dunes'].forEach(id => ref[id] = $(id));

  const scrollers = [...document.querySelectorAll('.scr')].map(g => ({
    g, id: g.id, x: parseFloat(g.dataset.x || 0), par: parseFloat(g.dataset.par || 1)
  }));

  const leg2str = (hip, knee, ank) =>
    `M ${hip.x} ${hip.y} L ${knee.x.toFixed(1)} ${knee.y.toFixed(1)} L ${ank.x.toFixed(1)} ${ank.y.toFixed(1)}`;

  // two-bone IK; picks the knee that bends backwards, like a bird's ankle
  function solveLeg(hip, ank) {
    const dx = ank.x - hip.x, dy = ank.y - hip.y;
    let d = Math.hypot(dx, dy);
    d = Math.min(Math.max(d, 12), L1 + L2 - 1);
    const a = Math.atan2(dy, dx);
    const q = Math.acos((L1 * L1 + d * d - L2 * L2) / (2 * L1 * d));
    const kA = { x: hip.x + L1 * Math.cos(a - q), y: hip.y + L1 * Math.sin(a - q) };
    const kB = { x: hip.x + L1 * Math.cos(a + q), y: hip.y + L1 * Math.sin(a + q) };
    return kA.x < kB.x ? kA : kB;
  }

  let last = null, T = 0, wheelA = 0, crankA = 0, scroll = 0;
  const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

  function frame(now) {
    let dt = 1 / 60;
    if (last != null) dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    T += dt;
    wheelA = (wheelA + WHEEL_W * dt) % (Math.PI * 2);
    crankA = (crankA + CRANK_W * dt) % (Math.PI * 2);
    scroll += V * dt;

    const wDeg = (wheelA * 180 / Math.PI).toFixed(2);
    const cDeg = (crankA * 180 / Math.PI).toFixed(2);

    setT(ref.spokesR, `rotate(${wDeg} 250 418)`);
    setT(ref.spokesF, `rotate(${wDeg} 610 418)`);
    setT(ref.cring, `rotate(${cDeg} 330 418)`);

    // pedals (near pedal leads, far pedal trails by half a turn)
    const pn = { x: BB.x + CRANK_R * Math.cos(crankA), y: BB.y + CRANK_R * Math.sin(crankA) };
    const pf = { x: BB.x - CRANK_R * Math.cos(crankA), y: BB.y - CRANK_R * Math.sin(crankA) };
    ref.armN.setAttribute('x2', pn.x.toFixed(1)); ref.armN.setAttribute('y2', pn.y.toFixed(1));
    ref.armF.setAttribute('x2', pf.x.toFixed(1)); ref.armF.setAttribute('y2', pf.y.toFixed(1));
    setT(ref.pedalN, `translate(${pn.x.toFixed(1)} ${pn.y.toFixed(1)})`);
    setT(ref.pedalF, `translate(${pf.x.toFixed(1)} ${pf.y.toFixed(1)})`);

    // legs (two-bone IK onto each pedal)
    const ankN = { x: pn.x - 3, y: pn.y - 7 };
    const ankF = { x: pf.x - 3, y: pf.y - 7 };
    const dN = leg2str(HIP_N, solveLeg(HIP_N, ankN), ankN);
    const dF = leg2str(HIP_F, solveLeg(HIP_F, ankF), ankF);
    ref.legNo.setAttribute('d', dN); ref.legNm.setAttribute('d', dN);
    ref.legFo.setAttribute('d', dF); ref.legFm.setAttribute('d', dF);
    setT(ref.footN, `translate(${ankN.x.toFixed(1)} ${ankN.y.toFixed(1)}) rotate(${(6 * Math.sin(crankA)).toFixed(1)})`);
    setT(ref.footF, `translate(${ankF.x.toFixed(1)} ${ankF.y.toFixed(1)}) rotate(${(6 * Math.sin(crankA + Math.PI)).toFixed(1)})`);

    // bird bobbles: body bounces twice per crank revolution, head lags, pouch jiggles
    const bob = Math.sin(2 * crankA);
    setT(ref.bodyG, `translate(0 ${(2.6 * Math.sin(2 * crankA + 0.6)).toFixed(2)}) rotate(${(0.8 * bob).toFixed(2)} 330 330)`);
    setT(ref.headG, `translate(0 ${(1.6 * Math.sin(2 * crankA - 0.9)).toFixed(2)}) rotate(${(0.7 * Math.sin(2 * crankA - 0.7)).toFixed(2)} 402 246)`);
    const ps = 1 + 0.045 * Math.sin(2 * crankA + 1.7);
    setT(ref.pouchG, `translate(468 164) scale(1 ${ps.toFixed(4)}) translate(-468 -164)`);
    const sx = 1 + 0.02 * bob;
    setT(ref.shadow, `translate(428 492) scale(${sx.toFixed(3)} 1) translate(-428 -492)`);

    // ground, chain, foam
    ref.centerline.setAttribute('stroke-dashoffset', (scroll % 52).toFixed(1));
    ref.chainTop.setAttribute('stroke-dashoffset', (-(scroll * 1.2) % 8).toFixed(2));
    ref.chainBot.setAttribute('stroke-dashoffset', ((scroll * 1.2) % 8).toFixed(2));
    ref.foam1.setAttribute('stroke-dashoffset', ((scroll * 0.22) % 48).toFixed(1));
    ref.foam2.setAttribute('stroke-dashoffset', ((scroll * 0.13) % 44).toFixed(1));
    setT(ref.dunes, `translate(${(-(scroll * 0.12) % 1800).toFixed(1)} 0)`);

    // parallax scrollers
    for (const s of scrollers) {
      s.x -= V * s.par * dt;
      if (s.x < -240) s.x += WRAP;
      if (s.id === 'boat') {
        const by = 372 + 3.2 * Math.sin(T * 0.85);
        const br = 2.6 * Math.sin(T * 0.6);
        setT(s.g, `translate(${s.x.toFixed(1)} ${by.toFixed(1)}) rotate(${br.toFixed(2)})`);
      } else {
        setT(s.g, `translate(${s.x.toFixed(1)} 0)`);
      }
    }
  }

  if (REDUCED) { frame(0); }
  else {
    const loop = now => { frame(now); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
