    * { box-sizing: border-box; }

      display: grid;
      place-items: center;
      background: #f7f2e5;
      color: #263e39;
    }
    main { width: min(100%, 1860px, 150svh); padding: clamp(12px, 2.3vw, 38px); }

    .print {
      position: relative;
      border: 1px solid #344940;
      overflow: hidden;
      background: #f7d9af;
    }
    #scene {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 12 / 7;
    }
    figcaption {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 1px 0;
    }
    h1 {
      margin: 0;
      font: italic 500 clamp(22px, 2.1vw, 34px)/1.1 'Baskerville', 'Palatino Linotype', Georgia, serif;
      letter-spacing: -.035em;
    }
    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-width: 86px;
      min-height: 36px;
      padding: 7px 15px;
      color: inherit;
      background: transparent;
      border: 1px solid #9aab9d;
      border-radius: 40px;
      font: 600 13px/1.2 'Segoe UI', sans-serif;
      cursor: pointer;
    }
    button:hover { background: #e7ebdf; }
    button:focus-visible { outline: 3px solid #367b71; outline-offset: 3px; }
    button svg { width: 12px; height: 12px; fill: currentColor; }
    [hidden] { display: none !important; }
    @media (max-aspect-ratio: 1/1) {
      #scene { height: min(73svh, 108vw); }
    }
    @media (max-height: 420px) and (orientation: landscape) {
      main { width: min(100%, 148svh); padding: 8px 14px; }
      figcaption { padding-top: 6px; }
    }
  </style>
</head>

              <path d="M667 194q12 -22 41 -23 24 0 43 19l7 14q-21 -8 -34 0 -18 15 -41 10 -12 -4 -16 -10Z" fill="#e4d8ab"/>
              <path d="M698 195q7 -15 21 -15 14 -1 23 14 -7 12 -23 13 -13 0 -21 -12Z" fill="#edd39a" stroke="#645c41" stroke-width="2.3"/>
              <g id="eye">
                <ellipse cx="720" cy="193" rx="10.2" ry="11.6" fill="#f9f2d8" stroke="#35453b" stroke-width="2.3"/>
                <ellipse cx="723" cy="193" rx="5.7" ry="7.5" fill="#293b35"/>
                <circle cx="725" cy="190" r="2" fill="#fff9e9"/>
              </g>
              <path d="M703 177q9 -6 18 -5" fill="none" stroke="#52604e" stroke-width="3"/>
              <path d="M678 210q7 4 14 2m-17 5 9 2" fill="none" stroke="#bcb89b" stroke-width="2"/>
              <!-- The lower pouch hangs well below the long upper mandible. -->
              <path d="M730 207q19 -11 36 1l206 35q-17 12 -46 18 -29 10 -63 23 -32 12 -65 3 -38 -10 -57 -40 -11 -16 -11 -40Z" fill="#e4a06b" stroke="#4e4934" stroke-width="3.6"/>
              <path d="M742 217q19 34 55 50 39 18 87 4l48 -13q-35 11 -69 23 -34 13 -65 3 -38 -11 -56 -41 -8 -13 -9 -28Z" fill="#d78960"/>
              <path d="M744 222q19 36 55 53m-46 -49q25 34 59 46m-46 -43q23 26 51 36" fill="none" stroke="#b97b53" stroke-width="1.8"/>
              <path d="M734 202q8 -9 25 -7 44 3 86 13l109 22q14 2 23 10 10 5 6 13 -2 6 -10 8 3 -8 -4 -10 -64 -2 -131 -14l-86 -14q-14 -4 -18 -11Z" fill="#f2c77b" stroke="#4d4933" stroke-width="3.7"/>
              <path d="M748 201q39 0 91 12l111 21" fill="none" stroke="#ffe2a3" stroke-width="4.3"/>
              <path d="M756 215q92 14 195 30" fill="none" stroke="#c29355" stroke-width="1.8"/>
              <path d="M972 238q17 5 11 15 -2 5 -10 8 3 -8 -3 -10l-8 -1q10 -3 10 -12Z" fill="#796346"/>
              <ellipse cx="757" cy="206" rx="6" ry="2.2" transform="rotate(8 757 206)" fill="#856c45"/>
              <!-- Soft cycling cap with stitched panel and a short, raised visor -->
              <path d="M645 176q-2 -16 12 -31 16 -19 46 -22 32 -1 47 21l5 11q-36 4 -61 15l-41 16Z" fill="#bc6047" stroke="#34463c" stroke-width="3.8"/>
              <path d="M651 165q7 -27 36 -35 -12 14 -12 35Z" fill="#d98564"/>
              <path d="M696 128q18 4 29 32" fill="none" stroke="#894b3b" stroke-width="2.7"/>
              <path d="M649 174q48 -11 98 -24l12 6q-53 12 -98 30 -12 3 -12 -12Z" fill="#994f3d" stroke="#3d4538" stroke-width="2.9"/>
              <path d="M701 169q34 -15 78 -20 9 -1 10 2 -3 7 -24 13 -28 7 -56 11Z" fill="#455548" stroke="#304238" stroke-width="3.2"/>
              <path d="M716 168q32 -12 59 -14" stroke="#88927a" stroke-width="1.8" fill="none"/>
              <ellipse cx="696" cy="125" rx="6.4" ry="3.5" transform="rotate(-9 696 125)" fill="#98513e" stroke="#405043" stroke-width="1.8"/>
            </g>
            <!-- A little silk scarf and two windblown tails -->
            <g id="scarf-tails">
              <path id="scarf-low" d="M646 306q-25 13 -47 9t-47 16l11 0 -5 11q25 -8 44 -9 29 2 47 -19Z" fill="#a0503c" stroke="#4e4637" stroke-width="3"/>
              <path id="scarf-high" d="M645 306q-26 2 -50 -11t-64 -4l14 7 -10 7q33 -7 56 5t54 4Z" fill="#cd7051" stroke="#4b4637" stroke-width="3.2"/>
            </g>
            <path d="M641 296q25 11 67 2l-2 16q-31 12 -65 -1Z" fill="#bd6045" stroke="#4e4838" stroke-width="3.2"/>
            <path d="M653 298q20 5 40 2l-5 4q-16 2 -30 -1Z" fill="#e39770"/>
            <path d="m640 298 10 3 1 14 -10 4 -9 -10Z" fill="#d47a54" stroke="#594a36" stroke-width="2.8"/>
            <!-- The outside wing reaches the handlebar. -->
            <path d="M516 369q24 -21 59 -16 33 4 66 29 42 30 83 44l48 16q11 4 10 8 -2 6 -23 3 5 5 -3 7 -19 1 -42 -8 4 6 -4 7 -22 -2 -42 -14l-18 -4q-28 -4 -53 -19 -37 -7 -61 -26 -15 -9 -22 -17" fill="#f3e9cc" stroke="#3e4c3e" stroke-width="3.5"/>
            <path d="M574 377q41 10 79 38 38 24 106 37m-163 -60q43 14 75 36 39 19 66 25m-165 -56q34 17 55 20m28 17 39 14" fill="none" stroke="#abae93" stroke-width="2.3"/>
            <path d="M522 365q25 -13 53 -6m-35 10q12 -4 24 -3m-31 11 10 -1" fill="none" stroke="#dbd3b6" stroke-width="3.3"/>
            <g fill="#596655">
              <path d="M734 436q19 4 38 8 10 3 8 6 -5 3 -20 0Z"/>
              <path d="m724 442 35 11q6 4 -3 5 -11 0 -23 -5Z"/>

    </div>
    <figcaption>
      <h1>The coastal commute</h1>
      <button id="playback" type="button" aria-label="Pause animation" hidden>
        <svg viewBox="0 0 12 12" aria-hidden="true"><path id="playback-icon" d="M2 1h3v10H2z M7 1h3v10H7z"/></svg>
        <span id="playback-text">Pause</span>
      </button>
    </figcaption>
  </figure>
</main>
<script>
(() => {
  'use strict';
  const byId = id => document.getElementById(id);
  const scene = byId('scene');
  const button = byId('playback');
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
  const turn = Math.PI * 2;
  const crank = { x: 684, y: 650, radius: 42 };
  const cycleSeconds = 2.35;
  const wheelRatio = 1.64;
  const roadSpeed = turn * 100 * wheelRatio / cycleSeconds;
  let playing = !reducedMotion.matches;
  let elapsed = 0;
  let lastTime = null;
  let frame = null;

  // Cache elements once so the animation only writes the attributes that move.
  const parts = Object.fromEntries([...scene.querySelectorAll('[id]')].map(el => [el.id, el]));
  const set = (id, attribute, value) => parts[id].setAttribute(attribute, value);
  const move = (id, x, y = 0) => set(id, 'transform', 'translate(' + x.toFixed(2) + ' ' + y.toFixed(2) + ')');
  const point = (x, y) => x.toFixed(2) + ' ' + y.toFixed(2);

  function drawLeg(side, phase, bob) {
    const near = side === 'near';
    const px = crank.x + crank.radius * Math.cos(phase);
    const py = crank.y + crank.radius * Math.sin(phase);
    const hipX = near ? 610 : 581;
    const hipY = (near ? 452 : 447) + bob;
    const ax = px - 16;
    const ay = py - 14;
    const dx = ax - hipX;
    const dy = ay - hipY;
    const distance = Math.hypot(dx, dy);
    const thigh = near ? 127 : 132;
    const shin = near ? 148 : 150;
    // Intersect two circles to keep the hock bent and both leg segments rigid.
    const along = (thigh * thigh - shin * shin + distance * distance) / (2 * distance);
    const bend = Math.sqrt(Math.max(0, thigh * thigh - along * along));
    const hx = hipX + (along * dx - bend * dy) / distance;
    const hy = hipY + (along * dy + bend * dx) / distance;
    const legPath = 'M' + point(hipX, hipY) + 'L' + point(hx, hy) + ' ' + point(ax, ay);
    set(side + '-limb-outline', 'd', legPath);
    set(side + '-limb', 'd', legPath);
    const crankPath = 'M' + point(crank.x, crank.y) + 'L' + point(px, py);
    set(side + '-crank', 'd', crankPath);
    move(side + '-pedal', px, py);
    if (near) {
      set('near-crank-outline', 'd', crankPath);
      const shinX = ax - hx;
      const shinY = ay - hy;
      set('shin-light', 'd', 'M' + point(hx + shinX * .12, hy + shinY * .12 - 2) +
        'L' + point(hx + shinX * .74, hy + shinY * .74 - 2));
      let bands = '';
      for (const fraction of [.82, .87, .92]) {
        const x = hx + shinX * fraction;
        const y = hy + shinY * fraction;
        bands += 'M' + point(x - 4 * shinY / shin, y + 4 * shinX / shin) +
          'l' + point(8 * shinY / shin, -8 * shinX / shin);
      }
      set('ankle-bands', 'd', bands);
    }
  }

  function draw(time) {
    const phase = time * turn / cycleSeconds + .64;
    const spin = (time / cycleSeconds * 360 * wheelRatio) % 360;
    const bob = 1.7 * Math.sin(2 * phase);
    set('rear-spokes', 'transform', 'rotate(' + spin.toFixed(2) + ')');
    set('front-spokes', 'transform', 'rotate(' + (spin + 7).toFixed(2) + ')');
    drawLeg('far', phase + Math.PI, bob);
    drawLeg('near', phase, bob);
    move('rider', 0, bob);
    const breeze = Math.sin(time * 4.3);
    const ripple = Math.sin(time * 4.3 - 1.1);
    set('scarf-high', 'd', 'M645 306Q619 308 595 ' + (295 + ripple * 3) + 'T531 ' + (291 + breeze * 7) +
      'l14 7 -10 7Q568 ' + (298 + breeze * 5) + ' 591 ' + (310 + ripple * 3) + 'T645 314Z');
    set('scarf-low', 'transform', 'rotate(' + (-2.4 * ripple).toFixed(2) + ' 644 308)');
    const blinkTime = (time + 2.3) % 5.8;
    const eyelid = blinkTime < .18 ? 1 - .93 * Math.sin(Math.PI * blinkTime / .18) : 1;
    set('eye', 'transform', 'translate(0 193) scale(1 ' + eyelid.toFixed(3) + ') translate(0 -193)');
    move('road-lines', -(time * roadSpeed % 720));
    move('foreground', -(time * roadSpeed * 1.14 % 720));
    move('verge', -(time * roadSpeed * .28 % 720));
    move('sea-lines', -(time * 9 % 720));
    move('gulls', 8 * Math.sin(time * .19), 5 * Math.sin(time * .38));
    set('sailboat', 'transform', 'translate(' + point(197 + 11 * Math.sin(time * .13), 486 + 1.5 * Math.sin(time * 1.2)) +
      ') rotate(' + (1.8 * Math.sin(time * 1.2)).toFixed(2) + ')');
  }

  function tick(now) {
    if (lastTime !== null) elapsed += Math.min((now - lastTime) / 1000, .1);
    lastTime = now;
    draw(elapsed);
    frame = requestAnimationFrame(tick);
  }

  function syncPlayback() {
    if (frame !== null) cancelAnimationFrame(frame);
    frame = null;
    lastTime = null;
    const action = playing ? 'Pause' : 'Play';
    byId('playback-text').textContent = action;
    button.setAttribute('aria-label', action + ' animation');
    byId('playback-icon').setAttribute('d', playing ? 'M2 1h3v10H2z M7 1h3v10H7z' : 'M2 1l9 5-9 5z');
    if (playing && !document.hidden) frame = requestAnimationFrame(tick);
  }

  // A tighter composition keeps the entire bicycle visible on portrait screens.
  function frameScene() {
    const { width, height } = scene.getBoundingClientRect();
    if (!width || !height) return;
    const ratio = width / height;
    const viewWidth = Math.max(730, Math.min(1440, 840 * ratio));
    const viewHeight = viewWidth / ratio;
    const inset = Math.max(0, (1440 - viewWidth) / 710);
    const center = 720 - 39 * inset;
    const top = (840 - viewHeight) * .47;
    scene.setAttribute('viewBox', [center - viewWidth / 2, top, viewWidth, viewHeight].join(' '));
    move('headland', -270 * inset);
    move('boat-position', 195 * inset);
    move('sun', -122 * inset, -28 * inset);
  }
  button.addEventListener('click', () => { playing = !playing; syncPlayback(); });
  reducedMotion.addEventListener('change', event => { playing = !event.matches; syncPlayback(); });
  document.addEventListener('visibilitychange', syncPlayback);
  new ResizeObserver(frameScene).observe(scene);
  frameScene();
  draw(0);
  button.hidden = false;
  syncPlayback();
})();
</script>
</body>
</html>
